<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملحمة الوسام | اللحوم والمشويات الفاخرة</title>
    <style>
        :root {
            --bg-color: #faf7f2;
            --primary-brown: #4a2c2a;
            --accent-gold: #c5a880;
            --text-dark: #2d2522;
            --card-bg: #ffffff;
            --border-color: #ebdccb;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-dark); }
        .container { max-width: 680px; margin: 0 auto; padding: 16px; padding-bottom: 120px; }
        .brand-header { text-align: center; padding: 40px 20px 30px; background: linear-gradient(to bottom, #f3ede2, var(--bg-color)); border-bottom: 1px solid var(--border-color); }
        .brand-logo { font-size: 2.2rem; font-weight: 800; color: var(--primary-brown); margin: 0 0 8px 0; }
        .meat-card { background-color: var(--card-bg); border-radius: 24px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 8px 24px rgba(74, 44, 42, 0.04); margin-bottom: 24px; }
        .card-image-wrapper { width: 100%; height: 280px; }
        .card-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 24px; }
        .weight-selector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .weight-pill { background-color: var(--card-bg); border: 2px solid #f0e6db; border-radius: 16px; padding: 16px 12px; text-align: center; cursor: pointer; }
        .weight-pill.active { border-color: var(--primary-brown); background-color: #fbf9f6; font-weight: bold; }
        .submit-order-btn { position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--primary-brown); color: #ffffff; padding: 20px; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; z-index: 1000; width: 100%; text-align: center; }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1 class="brand-logo">ملحمة الوسام</h1>
        <p>جودة وطعم لا يضاهى - مملكة البحرين</p>
    </div>

    <div class="container">
        <div class="meat-card">
            <div class="card-image-wrapper">
                <img src="https://aradbranding-ar-uploads.fsn1.your-objectstorage.com/topics/9d3b1173b6fa30e539f209db17ec9773ff6986af.webp" alt="لحم عجل">
            </div>
            <div class="card-content">
                <h2>لحم عجل بلدي فاخر</h2>
                <div class="weight-selector-grid">
                    <div class="weight-pill" onclick="this.classList.toggle('active')">1 كيلو - 5.500 د.ب</div>
                    <div class="weight-pill" onclick="this.classList.toggle('active')">2 كيلو - 11.000 د.ب</div>
                </div>
            </div>
        </div>

        <div class="meat-card">
            <div class="card-image-wrapper">
                <img src="https://cdn.salla.sa/vQqYv/Wre5RhDXt1ikmWcR7E2N64BYDTaf1VV5FFirFuVE.jpg" alt="كبدة">
            </div>
            <div class="card-content">
                <h2>كبدة وقلوب طازجة</h2>
                <div class="weight-selector-grid">
                    <div class="weight-pill" onclick="this.classList.toggle('active')">نص كيلو - 3.250 د.ب</div>
                    <div class="weight-pill" onclick="this.classList.toggle('active')">1 كيلو - 6.500 د.ب</div>
                </div>
            </div>
        </div>
    </div>

    <button class="submit-order-btn" onclick="window.open('https://wa.me/97335946352', '_blank')">إرسال الطلب للواتساب 💬</button>

</body>
</html>
