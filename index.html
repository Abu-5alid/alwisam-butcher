<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملحمة الوسام | اللحوم والمشويات الفاخرة</title>
    <style>
        :root {
            --bg-color: #faf7f2;
            --primary-brown: #4a2c2a;
            --accent-gold: #c5a880;
            --text-dark: #2d2522;
            --card-bg: #ffffff;
            --border-color: #ebdccb;
            --whatsapp-green: #25D366;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
        }
        
        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 120px;
        }
        
        /* الهيدر الفخم كأنه موقع آدم */
        .brand-header {
            text-align: center;
            padding: 40px 20px 30px;
            background: linear-gradient(to bottom, #f3ede2, var(--bg-color));
            border-bottom: 1px solid var(--border-color);
        }
        
        .brand-logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary-brown);
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }
        
        .brand-tagline {
            font-size: 1rem;
            color: #70625e;
            margin: 0 0 20px 0;
        }
        
        .meta-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .badge {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--primary-brown);
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .section-heading {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-brown);
            margin: 30px 4px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* بطاقات المنتجات بنفس روح الموقع الفاخر */
        .meat-card {
            background-color: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(74, 44, 42, 0.04);
            margin-bottom: 24px;
            transition: transform 0.2s ease;
        }
        
        .card-image-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background-color: #fcfbfa;
        }
        
        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-content {
            padding: 24px;
        }
        
        .card-content h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--primary-brown);
        }
        
        .card-content .desc {
            font-size: 0.95rem;
            color: #665e5b;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }
        
        /* شبكة الأوزان والأسعار الفاخرة */
        .weight-selector-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
