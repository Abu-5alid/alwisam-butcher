<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملحمة الوسام | اللحوم والمشويات الفاخرة</title>
    <style>
        :root {
            --bg-color: #fdfaf9;
            --primary-brown: #a00000; /* أحمر دموي فاخر */
            --accent-gold: #c5a880;
            --text-dark: #2d0000;
            --card-bg: #ffffff;
            --border-color: #f0dada;
        }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-dark); }
        .container { max-width: 680px; margin: 0 auto; padding: 16px; padding-bottom: 120px; }
        
        .brand-header { text-align: center; padding: 40px 20px 30px; background: linear-gradient(to bottom, #fff0f0, var(--bg-color)); border-bottom: 2px solid var(--primary-brown); }
        .brand-logo { font-size: 2.2rem; font-weight: 800; color: var(--primary-brown); margin: 0 0 8px 0; }
        .brand-tagline { font-size: 1rem; color: #702020; margin: 0 0 20px 0; }
        
        .badge { background-color: var(--card-bg); border: 1px solid var(--primary-brown); padding: 6px 14px; border-radius: 50px; font-size: 0.85rem; color: var(--primary-brown); font-weight: 600; margin: 5px; display: inline-block; }

        .section-heading { font-size: 1.25rem; font-weight: 700; color: var(--primary-brown); margin: 30px 4px 16px; }
        
        .meat-card { background-color: var(--card-bg); border-radius: 24px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 8px 24px rgba(160, 0, 0, 0.08); margin-bottom: 24px; }
        .card-image-wrapper { width: 100%; height: 280px; background-color: #fff5f5; }
        .card-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-content { padding: 24px; }
        .card-content h2 { font-size: 1.4rem; font-weight: 700; margin: 0 0 8px 0; color: var(--primary-brown); }
        
        .weight-selector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .weight-pill { background-color: var(--card-bg); border: 2px solid #fbdada; border-radius: 16px; padding: 16px 12px; text-align: center; cursor: pointer; }
        .weight-pill.active { border-color: var(--primary-brown); background-color: #fff0f0; font-weight: bold; }
        .weight-pill .price { color: var(--primary-brown); font-weight: 700; display: block; }
        
        .preferences-box { background-color: #fffafa; border-radius: 16px; padding: 18px; border: 1px dashed var(--primary-brown); margin-top: 16px; display: none; }
        .preferences-box.visible { display: block; }
        
        .input-style { width: 100%; padding: 12px; border: 1px solid var(--primary-brown); border-radius: 10px; box-sizing: border-box; }
        
        .sticky-footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: rgba(255, 255, 255, 0.98); border-top: 2px solid var(--primary-brown); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .submit-order-btn { background-color: var(--primary-brown); color: #ffffff; border: none; padding: 14px 28px; border-radius: 50px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="brand-header">
        <div class="brand-logo">ملحمة الوسام</div>
        <div class="brand-tagline">مفهوم جديد للحوم والمشويات الطازجة على أصولها</div>
        <div>
            <span class="badge">📞 35946352</span>
            <span class="badge">📸 @alwisam.bh</span>
        </div>
    </div>

    <div class="container">
        <!-- قسم اللحوم -->
        <div class="section-heading">🥩 لحم العجل البلدي والمفروم</div>
        <div class="meat-card" id="card-beef">
            <div class="card-image-wrapper"><img src="https://images.unsplash.com/photo-1603048297172-c92544798d5e?q=80&w=1000" alt="لحم عجل"></div>
            <div class="card-content">
                <h2>قطع لحم عجل هبرة ومفروم</h2>
                <div class="weight-selector-grid">
                    <div class="weight-pill" onclick="selectProductWeight('beef', '1 كيلو', 5.500, this)"><span>1 كيلو</span><span class="price">5.500 د.ب</span></div>
                </div>
                <div class="preferences-box" id="pref-beef">
                    <label>طريقة التجهيز:</label>
                    <select id="cut-beef" class="input-style"><option>مفروم</option><option>قطع</option></select>
                </div>
            </div>
        </div>

        <!-- بيانات الحجز -->
        <div class="checkout-card" style="padding: 20px; border: 1px solid var(--primary-brown); border-radius: 20px;">
            <h3>📅 بيانات الحجز</h3>
            <input type="text" id="order-customer-name" placeholder="اسم العميل" class="input-style" style="margin-bottom:10px;">
            <input type="datetime-local" id="order-pickup-time" class="input-style">
        </div>
    </div>

    <div class="sticky-footer-bar">
        <div class="price-summary"><div class="amount" id="final-bill-amount">0.000 د.ب</div></div>
        <button class="submit-order-btn" onclick="submitOrderToWhatsapp()">إرسال الطلب 💬</button>
    </div>

    <script>
        var activeOrderSession = { beef: { isSelected: false, weightTitle: '', cost: 0 } };
        function selectProductWeight(id, label, cost, el) {
            activeOrderSession[id] = { isSelected: true, weightTitle: label, cost: cost };
            document.getElementById('pref-' + id).classList.add('visible');
            document.getElementById('final-bill-amount').innerText = cost.toFixed(3) + " د.ب";
        }
        function submitOrderToWhatsapp() {
            var name = document.getElementById('order-customer-name').value;
            var time = document.getElementById('order-pickup-time').value;
            var msg = "طلب من " + name + " للوقت " + time;
            window.open("https://wa.me/97335946352?text=" + encodeURIComponent(msg), '_blank');
        }
    </script>
</body>
</html>
